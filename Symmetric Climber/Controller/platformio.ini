[env:esp32-c3-devkitm-1]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino

upload_port = COM7
monitor_port = COM6
monitor_speed = 115200

monitor_dtr = 0
monitor_rts = 0

lib_deps = 
    Wire
    SPI
    adafruit/Adafruit PWM Servo Driver Library @ ^3.0.1
    adafruit/Adafruit BusIO @ ^1.16.1
    adafruit/Adafruit INA219 @ ^1.2.3
    

lib_ldf_mode = deep+

build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1

; --- Active Build Filter ---
; To select which main file to build, keep '+<filename.cpp>' active and '-<filename.cpp>' ignored.
build_src_filter = -<main.cpp> -<diagnostic.cpp> +<previous.cpp> -<modernlayout.cpp> 